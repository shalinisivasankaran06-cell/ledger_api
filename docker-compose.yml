services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger
    ports:
      # host port 5433 so it doesn't clash with a Postgres already running on your machine
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates the extra ledger_test database used by the test suite
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ledger
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ledger_test
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
